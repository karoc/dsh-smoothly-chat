<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Two machines exchanging an envelope and a file over a signed link">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- left machine -->
    <rect x="56" y="86" width="156" height="128" rx="16" stroke="#8b93a1" stroke-width="2" fill="#8b93a1" fill-opacity="0.08"/>
    <line x1="82" y1="122" x2="186" y2="122" stroke="#a9b0bc" stroke-width="3"/>
    <line x1="82" y1="146" x2="186" y2="146" stroke="#a9b0bc" stroke-width="3"/>
    <line x1="82" y1="170" x2="150" y2="170" stroke="#a9b0bc" stroke-width="3"/>
    <!-- right machine -->
    <rect x="428" y="86" width="156" height="128" rx="16" stroke="#8b93a1" stroke-width="2" fill="#8b93a1" fill-opacity="0.08"/>
    <line x1="454" y1="122" x2="558" y2="122" stroke="#a9b0bc" stroke-width="3"/>
    <line x1="454" y1="146" x2="558" y2="146" stroke="#a9b0bc" stroke-width="3"/>
    <line x1="454" y1="170" x2="522" y2="170" stroke="#a9b0bc" stroke-width="3"/>
    <!-- link -->
    <line x1="226" y1="150" x2="414" y2="150" stroke="#8b93a1" stroke-width="2" stroke-dasharray="7 7"/>
    <path d="M382 140 l16 10 -16 10" stroke="#8b93a1" stroke-width="2"/>
    <path d="M258 140 l-16 10 16 10" stroke="#8b93a1" stroke-width="2"/>
    <!-- envelope above the link -->
    <rect x="268" y="58" width="104" height="64" rx="8" stroke="#5b8def" stroke-width="2" fill="#5b8def" fill-opacity="0.12"/>
    <path d="M272 64 l44 30 a8 8 0 0 0 8 0 l44 -30" stroke="#5b8def" stroke-width="2"/>
    <!-- file below the link -->
    <path d="M286 206 h52 l22 22 v46 h-74 z" stroke="#5b8def" stroke-width="2" fill="#5b8def" fill-opacity="0.12"/>
    <path d="M338 206 v22 h22" stroke="#5b8def" stroke-width="2"/>
    <line x1="300" y1="246" x2="346" y2="246" stroke="#5b8def" stroke-width="2"/>
    <line x1="300" y1="258" x2="336" y2="258" stroke="#5b8def" stroke-width="2"/>
  </g>
</svg>
